name: Intégration continue et déploiement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  qualite:
    name: Types, tests et build de la librairie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Tests unitaires, accessibilité (axe) et seuils de couverture
        run: npm run test:coverage

      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Construire la librairie
        run: npm run build

      - name: Vérifier les builds UMD sans outil de build
        run: npm run test:umd

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: librairie
          path: dist
          retention-days: 7

  demo:
    name: Construire le site de démonstration
    needs: qualite
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Construire la démo
        run: npm run build:demo

      # Bloquant si la variable de dépôt PA11Y_BLOQUANT vaut « true ».
      - name: Contrôle d'accessibilité de la démo (pa11y)
        continue-on-error: ${{ vars.PA11Y_BLOQUANT != 'true' }}
        run: |
          npx --yes http-server dist-demo -p 4173 --silent &
          npx --yes wait-on http://127.0.0.1:4173 --timeout 60000
          npx --yes pa11y-ci --config .pa11yci.json

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist-demo

  deploiement:
    name: Déployer sur GitHub Pages
    needs: demo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5