name: Publication npm

on:
  push:
    tags: ['v*']
  workflow_dispatch: # relance manuelle, à lancer sur un tag uniquement

permissions:
  contents: read

concurrency:
  group: publication-npm
  cancel-in-progress: false

jobs:
  # Construction sans aucun droit d'écriture ni jeton OIDC : un paquet compromis exécuté
  # pendant les tests ou le build ne peut pas publier.
  verifier:
    name: Vérifier et empaqueter
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      name: ${{ steps.paquet.outputs.name }}
      version: ${{ steps.paquet.outputs.version }}
      archive: ${{ steps.paquet.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Vérifier que le tag correspond à la version du paquet
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $version du package.json."
            exit 1
          fi

      - name: Vérifier la note de version dans CHANGELOG.md
        run: node scripts/changelog.mjs notes "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Vérifier les types
        run: npm run typecheck

      - name: Tests unitaires, accessibilité (axe) et seuils de couverture
        run: npm run test:coverage

      - name: Construire la librairie
        run: npm run build

      - name: Vérifier les builds UMD sans outil de build
        run: npm run test:umd

      - name: Empaqueter
        id: paquet
        run: |
          archive="$(npm pack --ignore-scripts --silent)"
          sha256sum "$archive"
          {
            echo "name=$(node -p "require('./package.json').name")"
            echo "version=$(node -p "require('./package.json').version")"
            echo "archive=$archive"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paquet-npm
          path: ${{ steps.paquet.outputs.archive }}
          retention-days: 7
          if-no-files-found: error

  # Seul job doté du jeton OIDC ; aucune dépendance du projet n'y est installée.
  # Environnement « npm » à protéger (relecteurs obligatoires, tags v* uniquement)
  # et à déclarer dans le Trusted Publisher sur npmjs.com.
  publier:
    name: Publier sur npm
    needs: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # échange du jeton OIDC contre un jeton de publication éphémère (Trusted Publishing)
    steps:
      # Sans registry-url : un _authToken vide empêcherait l'authentification OIDC.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Utiliser un npm compatible OIDC (version figée)
        run: npm install --global --ignore-scripts npm@11.21.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: paquet-npm

      - name: Publier si la version n'existe pas déjà
        env:
          NOM: ${{ needs.verifier.outputs.name }}
          VERSION: ${{ needs.verifier.outputs.version }}
          ARCHIVE: ${{ needs.verifier.outputs.archive }}
        run: |
          if npm view "$NOM@$VERSION" version --silent > /dev/null 2>&1; then
            echo "$NOM@$VERSION est déjà publié : rien à faire."
            exit 0
          fi
          npm publish "./$ARCHIVE" --ignore-scripts --access public

  release:
    name: Créer la release GitHub
    needs: publier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # création de la release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Créer la release à partir de la section du CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "La release $GITHUB_REF_NAME existe déjà : rien à faire."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          node scripts/changelog.mjs notes "$version" > notes.md
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$version" --notes-file notes.md "${flags[@]}"
