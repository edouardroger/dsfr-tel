name: Publication npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-npm
  cancel-in-progress: false

jobs:
  publier:
    name: Vérifier puis publier sur npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # échange du jeton OIDC contre un jeton de publication éphémère
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sans registry-url : un _authToken vide empêcherait l'authentification OIDC.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Utiliser un npm compatible OIDC (11.5.1 ou plus récent)
        run: npm install --global npm@latest

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier que le tag correspond à la version du paquet
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $version du package.json."
            exit 1
          fi

      - name: Vérifier les types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Construire la librairie
        run: npm run build

      - name: Publier si la version n'existe pas déjà
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version --silent > /dev/null 2>&1; then
            echo "$name@$version est déjà publié : rien à faire."
            exit 0
          fi
          npm publish --access public
