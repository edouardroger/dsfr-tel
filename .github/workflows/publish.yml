name: Publication npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-npm
  cancel-in-progress: false

jobs:
  publier:
    name: Vérifier puis publier sur npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # échange du jeton OIDC contre un jeton de publication éphémère (Trusted Publishing)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sans registry-url : un _authToken vide empêcherait l'authentification OIDC.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Utiliser un npm compatible OIDC (11.5.1 ou plus récent)
        run: npm install --global npm@11

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier que le tag correspond à la version du paquet
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $version du package.json."
            exit 1
          fi

      - name: Vérifier la note de version dans CHANGELOG.md
        run: node scripts/changelog.mjs notes "$(node -p "require('./package.json').version")" > /dev/null

      - name: Vérifier les types
        run: npm run typecheck

      - name: Tests unitaires, accessibilité (axe) et seuils de couverture
        run: npm run test:coverage

      - name: Construire la librairie
        run: npm run build

      - name: Vérifier le build UMD sans outil de build
        run: npm run test:umd

      - name: Publier si la version n'existe pas déjà
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version --silent > /dev/null 2>&1; then
            echo "$name@$version est déjà publié : rien à faire."
            exit 0
          fi
          npm publish --ignore-scripts

  release:
    name: Créer la release GitHub
    needs: publier
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # création de la release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Créer la release à partir de la section du CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "La release $GITHUB_REF_NAME existe déjà : rien à faire."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          node scripts/changelog.mjs notes "$version" > notes.md
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$version" --notes-file notes.md "${flags[@]}"
